<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #0E121C; font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D8C9A6; } a:hover { color: #EFE3C7; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0E121C; color: #ECEFF5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 62px 22px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#97A0B5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
      <div style="font-family: Newsreader, Georgia, serif; font-size: 24px; font-weight: 500;">Pattern</div>
    </div>

    <div style="display: flex; gap: 7px; background: #161B28; padding: 4px; border-radius: 10px; border: 1px solid #29303F;">
      <div style="flex-grow: 1; text-align: center; font-size: 12.5px; color: #97A0B5; padding: 8px 0; border-radius: 7px;">MST-1</div>
      <div style="flex-grow: 1; text-align: center; font-size: 12.5px; color: #97A0B5; padding: 8px 0; border-radius: 7px;">MST-2</div>
      <div style="flex-grow: 1; text-align: center; font-size: 12.5px; color: #1B1815; background: #F4EFE4; font-weight: 600; padding: 8px 0; border-radius: 7px;">End Sem</div>
    </div>
  </div>

  <div style="padding: 20px 22px 16px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid #1D2230;">
    <div style="font-family: Newsreader, Georgia, serif; font-size: 46px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums;">100</div>
    <div style="font-size: 13px; color: #646E85;">marks</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 13px; color: #97A0B5;">3 hours</div>
  </div>

  <div style="padding: 16px 22px 0; display: flex; flex-direction: column; gap: 11px;">

    <div style="background: #161B28; border: 1px solid #29303F; border-radius: 14px; padding: 15px 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em;">Part A</div>
        <div style="font-size: 12.5px; color: #D8C9A6; font-variant-numeric: tabular-nums; font-weight: 600;">20 marks</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12.5px; color: #97A0B5; width: 72px;">Questions</div>
        <div style="flex-grow: 1; display: flex; align-items: center; background: #10151F; border: 1px solid #29303F; border-radius: 9px; overflow: hidden;">
          <div style="width: 40px; text-align: center; font-size: 17px; color: #97A0B5; padding: 7px 0;">&minus;</div>
          <div style="flex-grow: 1; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">10</div>
          <div style="width: 40px; text-align: center; font-size: 17px; color: #ECEFF5; padding: 7px 0;">+</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12.5px; color: #97A0B5; width: 72px;">Marks each</div>
        <div style="flex-grow: 1; display: flex; align-items: center; background: #10151F; border: 1px solid #29303F; border-radius: 9px; overflow: hidden;">
          <div style="width: 40px; text-align: center; font-size: 17px; color: #97A0B5; padding: 7px 0;">&minus;</div>
          <div style="flex-grow: 1; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">2</div>
          <div style="width: 40px; text-align: center; font-size: 17px; color: #ECEFF5; padding: 7px 0;">+</div>
        </div>
      </div>
    </div>

    <div style="background: #161B28; border: 1px solid #3A4256; border-radius: 14px; padding: 15px 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em;">Part B</div>
        <div style="font-size: 12.5px; color: #D8C9A6; font-variant-numeric: tabular-nums; font-weight: 600;">80 marks</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12.5px; color: #97A0B5; width: 72px;">Questions</div>
        <div style="flex-grow: 1; display: flex; align-items: center; background: #10151F; border: 1px solid #29303F; border-radius: 9px; overflow: hidden;">
          <div style="width: 40px; text-align: center; font-size: 17px; color: #97A0B5; padding: 7px 0;">&minus;</div>
          <div style="flex-grow: 1; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">5</div>
          <div style="width: 40px; text-align: center; font-size: 17px; color: #ECEFF5; padding: 7px 0;">+</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12.5px; color: #97A0B5; width: 72px;">Choice</div>
        <div style="flex-grow: 1; display: flex; gap: 6px;">
          <div style="flex-grow: 1; text-align: center; font-size: 12px; color: #1B1815; background: #D8C9A6; font-weight: 600; padding: 8px 0; border-radius: 8px;">(a) or (b)</div>
          <div style="flex-grow: 1; text-align: center; font-size: 12px; color: #97A0B5; background: #10151F; border: 1px solid #29303F; padding: 8px 0; border-radius: 8px;">any 4 of 5</div>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; margin: 18px 22px 0; background: #F4EFE4; border-radius: 12px 12px 0 0; padding: 17px 19px; overflow: hidden; display: flex; flex-direction: column; gap: 11px;">
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #D8D0BF; padding-bottom: 9px;">
      <div style="font-size: 9.5px; letter-spacing: 0.16em; color: #8A8271; font-weight: 700;">LIVE PREVIEW</div>
      <div style="font-size: 10px; color: #8A8271; font-variant-numeric: tabular-nums;">15 questions</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-family: Newsreader, Georgia, serif; font-size: 11px; color: #6B6455; letter-spacing: 0.04em;">PART A &mdash; 10 &times; 2 = 20</div>
      <div style="display: flex; gap: 6px;">
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
        <div style="height: 5px; flex-grow: 1; background: #C9C0AC; border-radius: 3px;"></div>
      </div>
      <div style="font-family: Newsreader, Georgia, serif; font-size: 11px; color: #6B6455; letter-spacing: 0.04em; margin-top: 6px;">PART B &mdash; 5 &times; 16 = 80</div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; gap: 5px; align-items: center;"><div style="height: 5px; width: 46%; background: #B8AE98; border-radius: 3px;"></div><div style="font-size: 8px; color: #A79D87;">OR</div><div style="height: 5px; width: 40%; background: #B8AE98; border-radius: 3px;"></div></div>
        <div style="display: flex; gap: 5px; align-items: center;"><div style="height: 5px; width: 40%; background: #B8AE98; border-radius: 3px;"></div><div style="font-size: 8px; color: #A79D87;">OR</div><div style="height: 5px; width: 46%; background: #B8AE98; border-radius: 3px;"></div></div>
        <div style="display: flex; gap: 5px; align-items: center;"><div style="height: 5px; width: 50%; background: #B8AE98; border-radius: 3px;"></div><div style="font-size: 8px; color: #A79D87;">OR</div><div style="height: 5px; width: 36%; background: #B8AE98; border-radius: 3px;"></div></div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
